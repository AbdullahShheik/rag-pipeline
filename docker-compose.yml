services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_pgvector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  langchain_pipeline:
    build: ./pipelines
    container_name: rag_langchain
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pipelines:/app
      - ./docs:/app/docs
    command: python langchain_pipeline.py

  llamaindex_pipeline:
    build: ./pipelines
    container_name: rag_llamaindex
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pipelines:/app
      - ./docs:/app/docs
    command: python llamaindex_pipeline.py

volumes:
  pgvector_data: